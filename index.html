<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#008080">
<title>Experiment 95</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 18 16%27%3E%3Cpath d=%27M2 2l6-1v6H2z%27 fill=%27%23f00%27/%3E%3Cpath d=%27M9 1l7-1v7H9z%27 fill=%27%230a0%27/%3E%3Cpath d=%27M2 8h6v6l-6-1z%27 fill=%27%2300f%27/%3E%3Cpath d=%27M9 8h7v7l-7-1z%27 fill=%27%23fd0%27/%3E%3C/svg%3E">
<style>
  :root {
    --desktop: #008080;
    --face: #c0c0c0;
    --light: #ffffff;
    --mid: #dfdfdf;
    --shadow: #808080;
    --dark: #0a0a0a;
    --title-a: #000080;
    --title-b: #1084d0;
    --select: #000080;
    --font: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, Verdana, sans-serif;
    --mono: "Lucida Console", "Courier New", Courier, ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--desktop); color: #000;
    font-family: var(--font); font-size: 13px;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top); }
  .raised {
    background: var(--face);
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light),
                inset -2px -2px var(--shadow), inset 2px 2px var(--mid);
  }
  .sunken {
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shadow),
                inset -2px -2px var(--mid), inset 2px 2px var(--dark);
  }
  .btn {
    font: inherit; color: #000; border: 0; cursor: pointer; background: var(--face);
    min-height: 28px; padding: 3px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light),
                inset -2px -2px var(--shadow), inset 2px 2px var(--mid);
  }
  .btn:active, .btn.pressed {
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--dark),
                inset -2px -2px var(--mid), inset 2px 2px var(--shadow);
  }

  /* ---------- desktop & icons ---------- */
  .desktop { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .icons {
    position: absolute; inset: 8px; display: grid;
    grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 86px); grid-auto-columns: 84px;
    gap: 4px 6px; align-content: start;
  }
  .icon {
    width: 84px; height: 86px; padding: 4px 2px; border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font: inherit; color: #fff; text-align: center;
  }
  .icon svg { width: 36px; height: 36px; flex: none; image-rendering: pixelated; }
  .icon span { padding: 1px 3px; line-height: 1.2; max-width: 80px; word-wrap: break-word; }
  .icon:focus { outline: none; }
  .icon.selected span { background: var(--select); outline: 1px dotted #ff0; }
  .icon.selected svg { filter: brightness(.6) sepia(1) hue-rotate(190deg) saturate(4); }

  /* ---------- windows ---------- */
  .win {
    position: absolute; z-index: 10; padding: 3px; display: flex; flex-direction: column;
    min-width: 240px; max-width: calc(100% - 16px); max-height: calc(100% - 16px);
  }
  .win.inactive .titlebar { background: #808080; }
  .titlebar {
    display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 2px 0 4px; flex: none;
    background: linear-gradient(90deg, var(--title-a), var(--title-b)); color: #fff; font-weight: bold;
    cursor: grab; touch-action: none;
  }
  .titlebar svg.ti { width: 16px; height: 16px; flex: none; }
  .titlebar .tt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-btn { width: 18px; height: 16px; padding: 0; min-height: 0; flex: none; }
  .menubar { display: flex; gap: 2px; padding: 2px 0; flex: none; }
  .menubar span { padding: 2px 7px; }
  .win-body { flex: 1; min-height: 0; overflow: auto; background: #fff; margin: 2px 0; }
  .win-status { display: flex; gap: 2px; font-size: 12px; flex: none; }
  .win-status > div { padding: 3px 5px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* explorer list */
  .list { width: 100%; border-collapse: collapse; font-size: 12px; }
  .list th {
    text-align: left; font-weight: normal; padding: 3px 6px; position: sticky; top: 0; background: var(--face);
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light);
  }
  .list td { padding: 3px 6px; vertical-align: middle; white-space: nowrap; }
  .list td.desc { white-space: normal; color: #333; min-width: 180px; }
  .list tr.row { cursor: pointer; }
  .list tr.row:hover td:first-child span, .list tr.row:focus td:first-child span { background: var(--select); color: #fff; }
  .list tr.row:focus { outline: none; }
  .list td:first-child { display: flex; align-items: center; gap: 6px; }
  .list td svg { width: 18px; height: 18px; flex: none; }

  .notepad {
    margin: 0; padding: 6px 8px; font-family: var(--mono); font-size: 12px; line-height: 1.4;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  .msg { display: flex; gap: 12px; padding: 16px 12px 10px; align-items: flex-start; line-height: 1.4; background: var(--face); }
  .msg-actions { display: flex; justify-content: center; padding: 4px 0 10px; background: var(--face); }
  .msg-actions .btn { min-width: 80px; }

  /* ---------- taskbar & start menu ---------- */
  .taskbar {
    flex: none; display: flex; align-items: center; gap: 4px; position: relative; z-index: 30;
    height: calc(34px + env(safe-area-inset-bottom)); padding: 3px 3px calc(3px + env(safe-area-inset-bottom));
    background: var(--face); box-shadow: inset 0 1px var(--mid), inset 0 2px var(--light);
  }
  .start { font-weight: bold; padding: 2px 6px; }
  .tasks { flex: 1; min-width: 0; display: flex; gap: 3px; overflow: hidden; }
  .task { flex: 0 1 160px; min-width: 0; justify-content: flex-start; font-size: 12px; }
  .task span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.pressed { font-weight: bold; background-image: repeating-conic-gradient(var(--face) 0 25%, #fff 0 50%); background-size: 2px 2px; }
  .task svg { width: 14px; height: 14px; flex: none; }
  .tray { padding: 4px 10px; min-height: 28px; display: flex; align-items: center; font-size: 12px; }

  .startmenu {
    position: absolute; left: 2px; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 40;
    display: none; padding: 3px; min-width: 250px; max-width: calc(100% - 4px);
  }
  .startmenu.show { display: flex; }
  .sm-banner {
    width: 26px; flex: none; background: linear-gradient(0deg, #000080, #1084d0);
    color: #c0c0c0; font-weight: bold; font-size: 18px; writing-mode: vertical-rl; transform: rotate(180deg);
    padding: 6px 0; white-space: nowrap;
  }
  .sm-banner b { color: #fff; }
  .sm-items { flex: 1; display: flex; flex-direction: column; padding: 2px 0; }
  .sm-head { font-size: 11px; color: #404040; padding: 4px 10px 2px; }
  .sm-item {
    display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 8px; border: 0; background: none;
    font: inherit; color: #000; text-align: left; cursor: pointer; text-decoration: none;
  }
  .sm-item svg { width: 24px; height: 24px; flex: none; }
  .sm-item small { display: block; font-size: 11px; color: #404040; }
  .sm-item:hover, .sm-item:focus { background: var(--select); color: #fff; outline: none; }
  .sm-item:hover small, .sm-item:focus small { color: #dcdcff; }
  .startmenu hr { border: 0; border-top: 1px solid var(--shadow); border-bottom: 1px solid var(--light); margin: 3px 2px; }

  /* ---------- extras ---------- */
  body.busy, body.busy * { cursor: wait !important; }
  .shutdown {
    position: fixed; inset: 0; z-index: 100; background: #000; color: #ff8c00; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-family: var(--mono); font-size: 22px; line-height: 1.5; cursor: pointer;
  }
  .shutdown.show { display: flex; }
  .shutdown small { display: block; font-size: 12px; color: #808080; margin-top: 18px; }
</style>
</head>
<body>

<div class="desktop" id="desktop">
  <div class="icons" id="icons" role="list"></div>
</div>

<div class="startmenu raised" id="startmenu" role="menu">
  <div class="sm-banner"><b>Experiment</b>95</div>
  <div class="sm-items" id="smItems"></div>
</div>

<div class="taskbar">
  <button class="btn start" id="startBtn" aria-haspopup="menu">
    <svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 2l6-1v6H2z" fill="#ff0000"/><path d="M9 1l7-1v7H9z" fill="#00a000"/><path d="M2 8h6v6l-6-1z" fill="#0000ff"/><path d="M9 8h7v7l-7-1z" fill="#ffd800"/></svg>
    Start
  </button>
  <div class="tasks" id="tasks"></div>
  <div class="tray sunken" id="clock">12:00 PM</div>
</div>

<div class="shutdown" id="shutdown">
  <div>It's now safe to turn off<br>your computer.<small>Tap anywhere to restart</small></div>
</div>

<script>
(() => {
  'use strict';

  // ---------- icons (32x32 SVG, drawn in a chunky Win95 style) ----------
  const ICONS = {
    ascii: '<svg viewBox="0 0 32 32"><rect x="2" y="3" width="28" height="20" fill="#c0c0c0" stroke="#000"/><rect x="5" y="6" width="22" height="14" fill="#000"/><path d="M7 9h4M13 9h6M7 12h8M17 12h3M7 15h3M12 15h8M7 18h5" stroke="#33ff33" stroke-width="1.4"/><rect x="11" y="23" width="10" height="3" fill="#808080" stroke="#000"/><rect x="6" y="26" width="20" height="3" fill="#c0c0c0" stroke="#000"/></svg>',
    tracker: '<svg viewBox="0 0 32 32"><rect x="2" y="9" width="21" height="16" fill="#c0c0c0" stroke="#000"/><rect x="5" y="5" width="7" height="4" fill="#808080" stroke="#000"/><path d="M23 14l7-4v14l-7-4z" fill="#808080" stroke="#000"/><circle cx="12.5" cy="17" r="5" fill="#000080" stroke="#000"/><path d="M3 29C8 21 14 31 20 24s8-3 10-6" fill="none" stroke="#ff0000" stroke-width="2"/></svg>',
    blink: '<svg viewBox="0 0 32 32"><path d="M2 16Q16 2 30 16Q16 30 2 16z" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="16" cy="16" r="6" fill="#1084d0" stroke="#000"/><circle cx="16" cy="16" r="2.6" fill="#000"/><circle cx="18" cy="14" r="1.2" fill="#fff"/><path d="M5 9l-2-3M10 6l-1-3M16 5V2M22 6l1-3M27 9l2-3" stroke="#000" stroke-width="1.5"/></svg>',
    toon: '<svg viewBox="0 0 32 32"><path d="M7 30V12Q7 3 16 3t9 9v18z" fill="#ffd90f" stroke="#000" stroke-width="1.3"/><circle cx="12" cy="13" r="4.5" fill="#fff" stroke="#000"/><circle cx="20" cy="13" r="4.5" fill="#fff" stroke="#000"/><circle cx="12.5" cy="13" r="1.1"/><circle cx="20.5" cy="13" r="1.1"/><path d="M15 19q2 2 4 0" fill="none" stroke="#000"/><path d="M11 23q5 4 10 0q1 5-5 5t-5-5z" fill="#d1b271" stroke="#000"/><path d="M13 24.5q3 1.5 6 0" fill="none" stroke="#000"/></svg>',
    brows: '<svg viewBox="0 0 32 32"><path d="M3 12Q14 3 29 9" fill="none" stroke="#5a3a1a" stroke-width="3.5" stroke-linecap="round"/><path d="M4 21Q16 11 28 21Q16 30 4 21z" fill="#fff" stroke="#000" stroke-width="1.3"/><circle cx="16" cy="21" r="4" fill="#1084d0" stroke="#000"/><circle cx="16" cy="21" r="1.6"/><path d="M11 31V2M11 31L18 2M11 31L27 3" stroke="#ff2fa8" stroke-width="1.1"/></svg>',
    computer: '<svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="18" fill="#c0c0c0" stroke="#000"/><rect x="6" y="6" width="20" height="12" fill="#008080"/><rect x="10" y="21" width="12" height="3" fill="#808080" stroke="#000"/><rect x="4" y="24" width="24" height="5" fill="#c0c0c0" stroke="#000"/><rect x="18" y="26" width="7" height="1" fill="#000"/></svg>',
    folder: '<svg viewBox="0 0 32 32"><path d="M2 8h10l2 3h16v17H2z" fill="#ffd800" stroke="#000"/><path d="M2 13h28" stroke="#c09000"/></svg>',
    readme: '<svg viewBox="0 0 32 32"><path d="M6 2h15l6 6v22H6z" fill="#fff" stroke="#000"/><path d="M21 2v6h6" fill="#c0c0c0" stroke="#000"/><path d="M9 12h14M9 15h14M9 18h14M9 21h10M9 24h12" stroke="#000080"/></svg>',
    bin: '<svg viewBox="0 0 32 32"><path d="M8 9h16l-2 20H10z" fill="#c0c0c0" stroke="#000"/><rect x="6" y="6" width="20" height="3" fill="#808080" stroke="#000"/><path d="M13 12v14M16 12v14M19 12v14" stroke="#808080"/></svg>',
    github: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#000"/><path d="M11 25v-4q-4 1-5-2m5 6q0-3 2-4-6-1-6-6 0-2 1-3-1-2 0-4 2 0 4 2 3-1 6 0 2-2 4-2 1 2 0 4 1 1 1 3 0 5-6 6 2 1 2 4v4" fill="#fff"/></svg>',
    shutdown: '<svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="17" fill="#c0c0c0" stroke="#000"/><rect x="6" y="8" width="20" height="11" fill="#000"/><path d="M16 10v5" stroke="#ff8c00" stroke-width="2"/><path d="M12.5 12a5 5 0 1 0 7 0" fill="none" stroke="#ff8c00" stroke-width="1.6"/><rect x="9" y="24" width="14" height="4" fill="#808080" stroke="#000"/></svg>',
  };

  // ---------- the site: add a page here and it shows up everywhere ----------
  const APPS = [
    { id: 'ascii',   name: 'ASCII Cam',     file: 'ascii.html',   desc: 'Turns your camera into live ASCII art.' },
    { id: 'tracker', name: 'Tracker Cam',   file: 'tracker.html', desc: 'Lock onto an object and draw a red line as it moves.' },
    { id: 'blink',   name: 'Blink Counter', file: 'blink.html',   desc: 'Counts how many times you blink.' },
    { id: 'toon',    name: 'Toon Booth',    file: 'toon.html',    desc: 'Turns a photo of you into a yellow cartoon.' },
    { id: 'brows',   name: 'Brow Mapper',   file: 'brows.html',   desc: 'Maps where your eyebrows should start, arch and end.' },
  ];
  const REPO = 'https://github.com/romyjohal/experiment-one-';

  const README = `EXPERIMENT 95 - README.TXT
==========================

A little collection of camera toys for your phone
or computer, dressed up as Windows 95.

Everything runs in your browser. Nothing you film
or photograph is uploaded anywhere.

PROGRAMS
--------
${APPS.map(a => `${a.name.padEnd(14)} ${a.file}\n${''.padEnd(14)} ${a.desc}`).join('\n\n')}

TIPS
----
* Double-click an icon to open it (tap once on a phone).
* The Start menu lists every page on the site.
* Pages need camera permission. If you said no by
  accident, allow it in your browser's site settings.
`;

  const $ = id => document.getElementById(id);
  const desktop = $('desktop'), iconsEl = $('icons'), startBtn = $('startBtn'), startmenu = $('startmenu');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- launching ----------
  function launch(file) {
    closeStart();
    document.body.classList.add('busy');
    setTimeout(() => { location.href = file; }, 350);   // a moment of hourglass, for authenticity
  }
  window.addEventListener('pageshow', () => document.body.classList.remove('busy'));

  // ---------- windows ----------
  let zTop = 10, openWins = {};

  function focusWin(w) {
    Object.values(openWins).forEach(o => { o.el.classList.add('inactive'); o.task.classList.remove('pressed'); });
    w.el.classList.remove('inactive'); w.task.classList.add('pressed');
    w.el.style.zIndex = ++zTop;
  }

  function openWindow(id, { title, icon, body, status, width = 460, height = 320 }) {
    closeStart();
    if (openWins[id]) { const w = openWins[id]; w.el.hidden = false; focusWin(w); return w; }
    const el = document.createElement('div');
    el.className = 'win raised';
    el.innerHTML = `
      <div class="titlebar">
        <svg class="ti">${ICONS[icon].replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>
        <span class="tt">${esc(title)}</span>
        <button class="btn tb-btn" data-min aria-label="Minimize"><svg width="8" height="7"><rect x="0" y="5" width="6" height="2"/></svg></button>
        <button class="btn tb-btn" data-close aria-label="Close"><svg width="8" height="7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg></button>
      </div>
      ${body}
      ${status ? `<div class="win-status"><div class="sunken">${status}</div></div>` : ''}`;
    el.querySelector('.titlebar svg.ti').setAttribute('viewBox', '0 0 32 32');
    desktop.appendChild(el);

    const dw = desktop.clientWidth, dh = desktop.clientHeight, n = Object.keys(openWins).length;
    const w = Math.min(width, dw - 16), h = Math.min(height, dh - 16);
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.left = Math.max(8, Math.min(dw - w - 8, (dw - w) / 2 + n * 24)) + 'px';
    el.style.top = Math.max(8, Math.min(dh - h - 8, (dh - h) / 3 + n * 24)) + 'px';

    const task = document.createElement('button');
    task.className = 'btn task';
    task.innerHTML = ICONS[icon] + `<span>${esc(title)}</span>`;
    $('tasks').appendChild(task);

    const win = { el, task };
    openWins[id] = win;
    focusWin(win);

    el.addEventListener('pointerdown', () => focusWin(win));
    el.querySelector('[data-close]').onclick = () => { el.remove(); task.remove(); delete openWins[id]; };
    el.querySelector('[data-min]').onclick = e => { e.stopPropagation(); el.hidden = true; task.classList.remove('pressed'); };
    task.onclick = () => {
      if (el.hidden) { el.hidden = false; focusWin(win); }
      else if (task.classList.contains('pressed')) { el.hidden = true; task.classList.remove('pressed'); }
      else focusWin(win);
    };
    makeDraggable(el);
    return win;
  }

  function makeDraggable(el) {
    const bar = el.querySelector('.titlebar');
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      bar.setPointerCapture(e.pointerId);
      const move = ev => {
        const maxX = desktop.clientWidth - 40, maxY = desktop.clientHeight - 24;
        el.style.left = Math.max(40 - el.offsetWidth, Math.min(maxX, ox + ev.clientX - sx)) + 'px';
        el.style.top = Math.max(0, Math.min(maxY, oy + ev.clientY - sy)) + 'px';
      };
      const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
  }

  // ---------- the special windows ----------
  function openDirectory() {
    const rows = APPS.map(a => `
      <tr class="row" tabindex="0" data-file="${a.file}">
        <td>${ICONS[a.id]}<span>${esc(a.name)}</span></td>
        <td>${a.file}</td>
        <td class="desc">${esc(a.desc)}</td>
      </tr>`).join('') + `
      <tr class="row" tabindex="0" data-readme>
        <td>${ICONS.readme}<span>Readme</span></td><td>README.TXT</td><td class="desc">About this site.</td>
      </tr>`;
    openWindow('dir', {
      title: 'C:\\EXPERIMENT95', icon: 'folder', width: 560, height: 300,
      body: `<div class="menubar"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>H</u>elp</span></div>
             <div class="win-body sunken"><table class="list">
               <thead><tr><th>Name</th><th>File</th><th>Description</th></tr></thead><tbody>${rows}</tbody>
             </table></div>`,
      status: `${APPS.length + 1} object(s)`,
    });
    const tbody = openWins.dir.el.querySelector('tbody');
    const go = tr => tr && (tr.dataset.file ? launch(tr.dataset.file) : openReadme());
    tbody.onclick = e => go(e.target.closest('tr'));
    tbody.onkeydown = e => { if (e.key === 'Enter') go(e.target.closest('tr')); };
  }

  function openReadme() {
    openWindow('readme', {
      title: 'README.TXT - Notepad', icon: 'readme', width: 460, height: 380,
      body: `<div class="menubar"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>S</u>earch</span><span><u>H</u>elp</span></div>
             <div class="win-body sunken"><pre class="notepad">${esc(README)}</pre></div>`,
    });
  }

  function openBin() {
    openWindow('bin', {
      title: 'Recycle Bin', icon: 'bin', width: 320, height: 170,
      body: `<div class="msg">${ICONS.bin.replace('<svg', '<svg width="32" height="32"')}<div>The Recycle Bin is empty.<br>Nothing on this site has been thrown away... yet.</div></div>
             <div class="msg-actions"><button class="btn" data-ok>OK</button></div>`,
    });
    const w = openWins.bin;
    w.el.querySelector('[data-ok]').onclick = () => w.el.querySelector('[data-close]').click();
  }

  function shutDown() {
    closeStart();
    $('shutdown').classList.add('show');
  }
  $('shutdown').onclick = () => $('shutdown').classList.remove('show');

  // ---------- desktop icons ----------
  const DESKTOP = [
    { name: 'My Computer', icon: 'computer', open: openDirectory },
    ...APPS.map(a => ({ name: a.name, icon: a.id, open: () => launch(a.file) })),
    { name: 'Readme.txt', icon: 'readme', open: openReadme },
    { name: 'Recycle Bin', icon: 'bin', open: openBin },
  ];

  let lastPointer = 'mouse';
  DESKTOP.forEach(d => {
    const b = document.createElement('button');
    b.className = 'icon';
    b.setAttribute('role', 'listitem');
    b.innerHTML = ICONS[d.icon] + `<span>${esc(d.name)}</span>`;
    b.addEventListener('pointerdown', e => { lastPointer = e.pointerType; });
    // Mouse: click selects, double-click opens. Touch: one tap opens.
    b.addEventListener('click', () => {
      document.querySelectorAll('.icon.selected').forEach(i => i.classList.remove('selected'));
      b.classList.add('selected');
      if (lastPointer !== 'mouse') d.open();
    });
    b.addEventListener('dblclick', d.open);
    b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); d.open(); } });
    iconsEl.appendChild(b);
  });
  desktop.addEventListener('pointerdown', e => {
    if (!e.target.closest('.icon')) document.querySelectorAll('.icon.selected').forEach(i => i.classList.remove('selected'));
  });

  // ---------- start menu: a directory of the whole site ----------
  const smItem = (icon, label, sub, action) => {
    const b = document.createElement('button');
    b.className = 'sm-item';
    b.setAttribute('role', 'menuitem');
    b.innerHTML = ICONS[icon] + `<span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
    b.onclick = action;
    return b;
  };
  const sm = $('smItems');
  const head = t => { const d = document.createElement('div'); d.className = 'sm-head'; d.textContent = t; sm.appendChild(d); };
  head('Programs');
  APPS.forEach(a => sm.appendChild(smItem(a.id, a.name, a.desc, () => launch(a.file))));
  sm.appendChild(document.createElement('hr'));
  sm.appendChild(smItem('folder', 'Site Directory', 'Every page on this site', openDirectory));
  sm.appendChild(smItem('readme', 'Readme', null, openReadme));
  sm.appendChild(smItem('github', 'Source code', 'View on GitHub', () => { closeStart(); window.open(REPO, '_blank', 'noopener'); }));
  sm.appendChild(document.createElement('hr'));
  sm.appendChild(smItem('shutdown', 'Shut Down...', null, shutDown));

  function closeStart() { startmenu.classList.remove('show'); startBtn.classList.remove('pressed'); }
  startBtn.addEventListener('click', e => {
    e.stopPropagation();
    const show = !startmenu.classList.contains('show');
    startmenu.classList.toggle('show', show);
    startBtn.classList.toggle('pressed', show);
    if (show) sm.querySelector('.sm-item').focus();
  });
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#startmenu') && !e.target.closest('#startBtn')) closeStart();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeStart();
    if (startmenu.classList.contains('show') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const items = [...sm.querySelectorAll('.sm-item')], i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
      e.preventDefault();
    }
  });

  // ---------- clock ----------
  const tick = () => {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  };
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
